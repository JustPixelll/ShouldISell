name: One-time Deep Mine split refactor

on:
  push:
    branches: [ feature/craft-gather-opportunities ]
    paths: [ .github/workflows/deep-mine-split-refactor.yml ]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/craft-gather-opportunities
      - name: Apply source refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_required(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"Missing expected text for {label}")
              return text.replace(old, new, 1)

          # MainWindow: remove every control that starts a native queued market request.
          p = Path('ShouldISell/Windows/MainWindow.cs')
          text = p.read_text(encoding='utf-8-sig')
          text = replace_required(text,
          '''            if (ImGui.BeginTabItem("Market Refresh"))
                      {
                          DrawRefresh();
                          ImGui.EndTabItem();
                      }
          ''', '', 'Market Refresh tab')

          text, n = re.subn(
              r'\n        ImGui\.SameLine\(\);\n        if \(!plugin\.RefreshEngine\.IsRunning\)\n        \{.*?\n        \}\n        ImGui\.TextDisabled\(plugin\.Coordinator\.FetchStatus\);',
              '\n        ImGui.TextDisabled(plugin.Coordinator.FetchStatus);',
              text, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('Could not remove header native scan controls')

          text, n = re.subn(
              r'(    private void DrawCurrentListings\(\)\n    \{)\n        if \(!plugin\.RefreshEngine\.IsRunning\).*?\n        ImGui\.Spacing\(\);',
              r'\1\n        ImGui.TextDisabled("Live market snapshots update passively from normal Market Board use or Should I Deep Mine?.");\n        ImGui.Spacing();',
              text, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('Could not remove listing native scan controls')

          text, n = re.subn(
              r'\n    private void DrawRefresh\(\)\n    \{.*?\n    \}\n\n    private void DrawSettings\(\)',
              '\n    private void DrawSettings()',
              text, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('Could not remove DrawRefresh method')

          # Remove old experimental settings one property block at a time.
          text = text.replace('\n        ImGui.Separator();\n        ImGui.Text("Technical refresh controls");', '')
          for prop in ['ExperimentalRefreshStaleHours', 'ExperimentalRequestSpacingMs', 'ExperimentalRequestTimeoutMs', 'ExperimentalMaxRetries']:
              pattern = rf'\n        var (\w+) = cfg\.{prop};\n        if \(ImGui\.[^\n]+\n        \{{\n            cfg\.{prop} = \1;\n            cfg\.Save\(\);\n        \}}'
              text, _ = re.subn(pattern, '', text, count=1)
          p.write_text(text, encoding='utf-8')

          # Buy model: fresh native snapshots remain usable regardless of which plugin produced them.
          p = Path('ShouldISell/Windows/SuiteWindow.BuyModel.cs')
          text = p.read_text(encoding='utf-8-sig')
          text = replace_required(text,
          '''        var live = !plugin.RefreshEngine.IsRunning
                      ? plugin.Store.GetMarket(raw.WorldId, raw.Item.ItemId)
                      : null;
          ''',
          '''        var live = plugin.Store.GetMarket(raw.WorldId, raw.Item.ItemId);
          ''', 'BuyModel live snapshot lookup')
          text = text.replace('Native FFXIV Deep Scan', 'Fresh FFXIV snapshot')
          text = text.replace('native FFXIV Deep Scan', 'fresh FFXIV snapshot')
          p.write_text(text, encoding='utf-8')

          # Gather v1: remove arbitrary +/-35% padding and the unsupported timed-node yield boost.
          p = Path('ShouldISell/Services/ProductionOpportunityScanner.cs')
          text = p.read_text(encoding='utf-8-sig')
          text = replace_required(text,
          '''        var baseRate = source.IsHidden ? 7.5 : 10.5;
                  if (source.IsTimed)
                      baseRate *= 1.08;
                  var levelHeadroom = Math.Max(0, source.PlayerLevel - source.RequiredLevel);
                  baseRate *= 1.0 + Math.Min(0.20, levelHeadroom / 500.0);
                  var lowRate = baseRate * 0.65;
                  var highRate = baseRate * 1.35;
          ''',
          '''        var baseRate = source.IsHidden ? 7.5 : 10.5;
                  var levelHeadroom = Math.Max(0, source.PlayerLevel - source.RequiredLevel);
                  baseRate *= 1.0 + Math.Min(0.20, levelHeadroom / 500.0);
                  // Keep the legacy fields equal to the baseline until a real range can be derived
                  // from node topology or observed personal sessions. Arbitrary uncertainty bands
                  // belong in confidence, not in fake numerical precision.
                  var lowRate = baseRate;
                  var highRate = baseRate;
          ''', 'gather throughput band')
          text = text.replace(
              '$"Generic active-yield model: {lowRate:0.0}–{highRate:0.0} item(s)/active minute; midpoint {baseRate:0.0}.",',
              '$"Generic active-yield baseline: {baseRate:0.0} item(s)/active minute. A numerical range is withheld until node topology or personal telemetry can support it.",')
          text = text.replace(
              '"Travel, GP rotation, gear, node-to-node movement and player execution are not yet learned personally, so the effort estimate is a range.",',
              '"Node-to-node movement, GP rotation, gear and player execution are not yet learned personally; that uncertainty is represented by confidence.",')
          text = text.replace(
              '$"Modeled {gather.EstimatedGilPerActiveMinuteLow:N0}–{gather.EstimatedGilPerActiveMinuteHigh:N0}g per active minute; market velocity {gather.UnitsPerDay:0.##}/day.",',
              '$"Modeled ~{gather.EstimatedGilPerActiveMinute:N0}g per active minute from the current generic baseline; market velocity {gather.UnitsPerDay:0.##}/day.",')
          p.write_text(text, encoding='utf-8')

          # The native request engine and market-window scan detector now belong to Deep Mine.
          for file in [
              'ShouldISell/Services/ExperimentalRefreshEngine.cs',
              'ShouldISell/Services/SellScanContextService.cs',
          ]:
              target = Path(file)
              if target.exists():
                  target.unlink()
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split native deep scanning into Deep Mine"
          git push origin HEAD:feature/craft-gather-opportunities
