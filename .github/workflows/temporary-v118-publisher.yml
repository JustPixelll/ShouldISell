name: Temporary v1.1.8 publisher

on:
  push:
    branches: [ main ]
    paths:
      - .github/v118-publish-trigger

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish v1.1.8 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Should I? v1.1.8

          Expands **Should I Tycoon?** into a broader gil/capital ledger and adds exact-state timing to **Should I Sell?** current listings.

          ## Current Listings: how long has it really been like this?
          - New **As-is** column shows how long the exact currently observed **price + quantity** combination has remained unchanged.
          - Hovering it also shows:
            - full observed listing lifetime,
            - current-price age,
            - current-quantity age.
          - The full listing lifetime does **not** reset after a quantity change, so you can still see how long the overall position has been listed before partial sales/stack changes.
          - These are observation ages: FFXIV does not expose the original server-side listing timestamp, and changes made while the retainer is not observable are timestamped when Should I? next sees them.

          ## Tycoon: gil cashflow ledger
          - Tycoon now records direct changes to your character's gil wallet while Should I? is running.
          - Login/character switch establishes a baseline; offline changes are never fabricated into transactions.
          - Exact confirmed Market Board purchases are automatically attributed when their total cost matches the observed wallet decrease.
          - Other wallet changes stay **Unclassified** unless their source is known; Tycoon does not guess quest/duty/vendor/etc. from the balance alone.
          - Wallet entries can be categorized as Market Board purchase, Vendor, Quest, Duty / roulette, Teleport, Repair, Crafting / materials, Glamour, Housing, Player trade, Retainer transfer/internal, Other, or Unclassified.
          - New cashflow overview shows current wallet, observed income/spend/net, category breakdown, Market Board purchase spend, captured Market Board sale income, and trading P&L.
          - Retainer Market Board sale income remains a separate high-confidence economic source because the sale happens before that gil is later withdrawn into the player wallet.

          ## Personal purchases vs trading positions
          - New **Purchases** tab shows every confirmed Market Board buy.
          - Any purchase lot can be reversibly marked **Personal** for crafting, glamour, housing, or other non-trading use.
          - Personal lots stay in real spending history but are excluded from FIFO trading P&L and **Trade Positions**.
          - Use **Track as trade** to add a lot back at any time.
          - Open Positions has been renamed **Trade Positions** to make that distinction explicit.

          Existing `trader-data.json` purchase history is preserved; the file is extended compatibly with wallet-flow entries and purchase-purpose exclusions.
          EOF

          if gh release view v1.1.8 >/dev/null 2>&1; then
            echo "v1.1.8 already exists."
          else
            gh release create v1.1.8 --target main --title "Should I? v1.1.8" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
