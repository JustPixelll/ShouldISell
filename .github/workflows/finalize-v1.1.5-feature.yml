name: Finalize v1.1.5 feature once

on:
  push:
    branches: [ feature/v1.1.5-buy-capital-live-model ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'RUN-V1.1.5-FEATURE-FINALIZE'
    runs-on: windows-2022
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/v1.1.5-buy-capital-live-model
          fetch-depth: 0

      - name: Apply final source patch
        shell: pwsh
        run: .\scripts\finalize-v1.1.5-model.ps1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Commit validated final source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/Services/ScoreCalculator.cs ShouldISell/Windows/SuiteWindow.BuyModel.cs ShouldISell/Plugin.cs ShouldISell/Windows/SuiteWindow.Tycoon.cs
          git rm .github/workflows/finalize-v1.1.5-feature.yml scripts/finalize-v1.1.5-model.ps1
          git commit -m "fix: finalize v1.1.5 buy model and tycoon insights"
          git push origin HEAD:feature/v1.1.5-buy-capital-live-model
