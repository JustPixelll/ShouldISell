name: Temporary v2.0.1 ROI patch runner

on:
  push:
    branches: [ fix/v2.0.1-roi-accounting ]
    paths:
      - .github/v2_0_1_roi_trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/v2.0.1-roi-accounting
          fetch-depth: 0

      - name: Apply ROI/accounting patch
        run: python .github/v2_0_1_roi_patch.py

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/TradingModels.cs \
                  ShouldISell/Services/TraderAnalyzer.cs \
                  ShouldISell/Windows/SuiteWindow.Tycoon.cs \
                  ShouldISell/ShouldISell.csproj \
                  ShouldISell/Services/BuyOpportunityScanner.cs \
                  RELEASE_NOTES_v2.0.1.md
          git commit -m "Fix Tycoon ROI accounting semantics"
          git push origin HEAD:fix/v2.0.1-roi-accounting
