name: Temporary v2.1.0 follow-up fixer

on:
  push:
    branches: [ feature/v2.1.0-economic-workflows ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v2.1.0-economic-workflows
          fetch-depth: 0
      - name: Apply follow-up fixes once
        shell: bash
        run: |
          if grep -q 'ImGuiComponents.IconButton' ShouldISell/Windows/SuiteWindow.TycoonCashflow.cs; then
            echo 'Follow-up already applied.'
            exit 0
          fi
          python .github/v2_1_0_followup_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ShouldISell
          git commit -m 'fix: harden vendor cost attribution and cashflow icons'
          git push origin HEAD:feature/v2.1.0-economic-workflows
