name: Publish Should I v1.1.4 once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Find packaged plugin
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create v1.1.4 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4
          name: Should I? v1.1.4
          target_commitish: main
          files: ${{ steps.package.outputs.path }}
          body: |
            Small Should I Sell? owned-items quality-of-life update.

            - Filter Owned Items by All locations, Player inventory, All retainers, or a specific cached retainer.
            - Scoped Qty display and quantity sorting.
            - Sell scoring/pricing/stack guidance continues to model the full known position.
