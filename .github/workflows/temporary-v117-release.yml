name: Temporary v1.1.7 release runner

on:
  push:
    branches: [ main ]
    paths:
      - .github/v117-release-trigger

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary release machinery first
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temporary-v117-release.yml .github/v117-release-trigger
          git commit -m "chore: clean v1.1.7 release runner"
          git push origin main

      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ".\ShouldISell\ShouldISell.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -ne "1.1.7.0") { throw "Expected project version 1.1.7.0, got $version" }
          if (git tag -l "v1.1.7") { throw "Tag v1.1.7 already exists" }

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore and build Release
        shell: pwsh
        run: |
          dotnet restore .\ShouldISell\ShouldISell.csproj
          dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\latest.zip" -Force
          "path=$env:RUNNER_TEMP\latest.zip" >> $env:GITHUB_OUTPUT

      - name: Publish v1.1.7 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = (git rev-parse HEAD).Trim()
          $notes = @"
          Should I Buy? now protects high-value opportunities from being crowded out by tiny extreme-ROI anomalies during broad discovery.

          - Broad shortlist ROI is log-scaled/capped and now gives real weight to absolute gil upside.
          - Roughly one third of detailed Universalis slots are reserved for the largest plausible absolute-gil gaps.
          - Rare items can use discounted DC/region aggregate evidence as a discovery-only fallback when the current world has no sale in Universalis' short aggregate window.
          - Final recommendations still require current-world detailed listings, 90-day current-world history, configured ROI/profit/holding limits, and the existing safety model.
          - Vendor -> Market remains world-local.
          - The Buy UI now shows the effective per-item gil cap and warns when equippable gear is excluded.
          "@
          gh release create v1.1.7 --target $target --title "Should I? v1.1.7" --notes $notes
          gh release upload v1.1.7 "${{ steps.package.outputs.path }}#latest.zip" --clobber

      - name: Update custom repository manifest
        shell: pwsh
        run: |
          $download = "https://github.com/JustPixelll/ShouldISell/releases/download/v1.1.7/latest.zip"
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          if ($manifest.Count -ne 1) { throw "Expected exactly one plugin entry in pluginmaster.json." }
          $manifest[0].AssemblyVersion = "1.1.7.0"
          $manifest[0].DownloadLinkInstall = $download
          $manifest[0].DownloadLinkUpdate = $download
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $manifest[0].Changelog = "v1.1.7 improves high-ticket Buy discovery: tiny extreme-ROI anomalies no longer monopolize the detailed shortlist; high absolute-gil gaps receive reserved analysis capacity; rare items may use conservative DC/region aggregates for discovery only, while final recommendations remain current-world and must pass the existing risk gates. The Buy UI now also exposes the effective per-item acquisition cap and gear-exclusion warning."
          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8

          git add pluginmaster.json
          git commit -m "chore: update plugin repository for v1.1.7"
          git push origin main
