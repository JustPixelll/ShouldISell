name: Temporary v2 PR patch runner

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'release/v2.0.0-suite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 release branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: release/v2.0.0-suite
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pillow
        if: ${{ hashFiles('.github/v2_patch.py') != '' }}
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply v2 patch when pending
        if: ${{ hashFiles('.github/v2_patch.py') != '' }}
        run: python .github/v2_patch.py

      - name: Commit v2 changes when needed
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "v2 patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.0.0 suite identity and scanner fixes"
          git push origin HEAD:release/v2.0.0-suite
