name: Release Should I Sell

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Locate release package
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\latest.zip" -Force
          "path=$env:RUNNER_TEMP\latest.zip" >> $env:GITHUB_OUTPUT

      - name: Upload latest.zip to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" "${{ steps.package.outputs.path }}#latest.zip" --clobber

      - name: Update custom repository manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          [xml]$project = Get-Content ".\ShouldISell\ShouldISell.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read project version." }

          $repo = "https://github.com/JustPixelll/ShouldISell"
          $download = "$repo/releases/download/$env:RELEASE_TAG/latest.zip"
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          if ($manifest.Count -ne 1) { throw "Expected exactly one plugin entry in pluginmaster.json." }

          $manifest[0].AssemblyVersion = $version
          $manifest[0].DownloadLinkInstall = $download
          $manifest[0].DownloadLinkUpdate = $download
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()

          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_BODY)) {
            $manifest[0].Changelog = $env:RELEASE_BODY.Trim()
          } else {
            $manifest[0].Changelog = "Release $env:RELEASE_TAG"
          }

          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json

          if (git diff --cached --quiet) {
            Write-Host "pluginmaster.json already current."
          } else {
            git commit -m "chore: update plugin repository for $env:RELEASE_TAG"
            git push origin main
          }
