name: Apply v1.1.5 Buy model feature once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-feature:
    if: github.event.head_commit.message == 'RUN-V1.1.5-FEATURE-PATCH'
    runs-on: windows-2022
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/v1.1.5-buy-capital-live-model
          fetch-depth: 0

      - name: Apply targeted source patches
        shell: pwsh
        run: .\scripts\apply-v1.1.5-buy-capital-live-model.ps1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build patched plugin
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Commit patched sources to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/Services/BuyOpportunityScanner.cs ShouldISell/Plugin.cs ShouldISell/Windows/SuiteWindow.Buy.cs ShouldISell/ShouldISell.csproj
          if (git diff --cached --quiet) { throw "Patch produced no source changes." }
          git commit -m "fix: rework Buy capital deployment and live re-scoring"
          git push origin HEAD:feature/v1.1.5-buy-capital-live-model
