name: Publish Should I test-install release

on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/publish-test-install.yml ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Build package
        shell: pwsh
        run: |
          dotnet restore .\ShouldISell\ShouldISell.csproj
          dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\latest.zip" -Force

      - name: Publish v2.2.0 test-install release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.2.0"
          $asset = "$env:RUNNER_TEMP\latest.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$asset#latest.zip" --clobber
          } else {
            gh release create $tag "$asset#latest.zip" --target main --title "Should I? v2.2.0" --notes "Test-install release for the merged v2.2.0 feature set. Official Dalamud submission preparation will follow after local testing."
          }

      - name: Point custom repository manifest at v2.2.0
        shell: pwsh
        run: |
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          $manifest[0].AssemblyVersion = "2.2.0.0"
          $manifest[0].DownloadLinkInstall = "https://github.com/JustPixelll/ShouldISell/releases/download/v2.2.0/latest.zip"
          $manifest[0].DownloadLinkUpdate = "https://github.com/JustPixelll/ShouldISell/releases/download/v2.2.0/latest.zip"
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $manifest[0].Changelog = "v2.2.0 test-install: Craft, Gather, Opportunities, Universalis-only refresh UX, Buy lane redesign, Tycoon cleanup, item hover/context integration, and Deep Mine split."
          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: point plugin repository at v2.2.0"
            git push origin main
          }
