name: Publish Should I v2.3.1

on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/publish-v2.3.1.yml ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination
      - name: Build package
        shell: pwsh
        run: |
          dotnet restore .\ShouldISell\ShouldISell.csproj --locked-mode
          dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\latest.zip" -Force
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.3.1"
          $asset = "$env:RUNNER_TEMP\latest.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$asset#latest.zip" --clobber
          } else {
            gh release create $tag "$asset#latest.zip" --target main --title "Should I? v2.3.1" --notes "v2.3.1 testing release: public integration cleanup, neutral optional local market-data IPC, and official testing-submission preparation."
          }
      - name: Update custom repository manifest
        shell: pwsh
        run: |
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          $manifest[0].AssemblyVersion = "2.3.1.0"
          $manifest[0].DownloadLinkInstall = "https://github.com/JustPixelll/ShouldISell/releases/download/v2.3.1/latest.zip"
          $manifest[0].DownloadLinkUpdate = "https://github.com/JustPixelll/ShouldISell/releases/download/v2.3.1/latest.zip"
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $manifest[0].Changelog = "v2.3.1 testing release: public integration cleanup, neutral optional local market-data IPC, and official testing-submission preparation."
          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: update plugin repository for v2.3.1"
            git push origin main
          }
