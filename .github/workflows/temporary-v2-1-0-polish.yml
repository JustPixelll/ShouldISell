name: Temporary v2.1.0 accounting polish

on:
  push:
    branches: [ feature/v2.1.0-economic-workflows ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v2.1.0-economic-workflows
          fetch-depth: 0
      - name: Apply accounting polish once
        shell: bash
        run: |
          if grep -q 'predictionQuantityMatches' ShouldISell/Windows/SuiteWindow.TycoonCashflow.cs; then
            echo 'Polish already applied.'
            exit 0
          fi
          python .github/v2_1_0_polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ShouldISell
          git commit -m 'polish: align manual vendor predictions with recorded lots'
          git push origin HEAD:feature/v2.1.0-economic-workflows
