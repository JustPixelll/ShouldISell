name: Remove final private reference and verify zero hits

on:
  push:
    branches: [ feature/private-data-cleanup-submit ]
    paths: [ .github/workflows/final-zero-private-refs.yml ]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Clean and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ShouldISell/Windows/MainWindow.cs')
          s=p.read_text().replace('Live market snapshots update passively from normal Market Board use or Should I Deep Mine?.','Live market snapshots update passively from normal Market Board use and compatible local data providers.')
          p.write_text(s)
          for f in [Path('private-ref-hits.txt'), Path('.github/workflows/final-zero-private-refs.yml')]:
              if f.exists(): f.unlink()
          pattern=re.compile(r'deep\s*mine|deepmine|shouldideepmine',re.I)
          hits=[]
          for f in Path('.').rglob('*'):
              if not f.is_file() or '.git' in f.parts: continue
              try: text=f.read_text()
              except Exception: continue
              if pattern.search(text) or pattern.search(str(f)): hits.append(str(f))
          if hits:
              print('Remaining private references:', *hits, sep='\n')
              raise SystemExit(1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final private reference and verify zero hits"
          git push origin feature/private-data-cleanup-submit
