name: Build Should I Sell

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Find packaged plugin
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Package: $($package.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShouldISell
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish Should I v1.1.0 live
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'LIVE-PUBLISH-v1.1.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.1.0"
          $repo = $env:GITHUB_REPOSITORY
          $package = "${{ steps.package.outputs.path }}"
          $notesPath = "$env:RUNNER_TEMP\release-notes.md"

          @"
          # Should I? v1.1.0

          The first unified **Should I?** live release.

          ## Should I Sell?
          Keeps the existing selling analysis, live refresh, stack guidance, current-listing audit, vendor economics, and personal sales history.

          ## Should I Buy?
          Adds budget-aware Universalis opportunity discovery, deep listing/history analysis, market and vendor arbitrage, split/consolidate detection, risk-adjusted scoring, holding-time estimates, portfolio allocation, and LIVE VERIFY against fresh FFXIV Market Board data.

          ## Should I Tycoon?
          Adds confirmed Market Board purchase capture, FIFO cost basis, realized/unrealized analytics, item and strategy performance, trader-profile analysis, and prediction-vs-reality calibration.

          This release is being promoted directly for live single-tester validation. Recommendations remain read-only and Should I? never automatically purchases Market Board listings.
          "@ | Set-Content $notesPath -Encoding UTF8

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$package#latest.zip" --repo $repo --clobber
          } else {
            gh release create $tag "$package#latest.zip" --repo $repo --target "$env:GITHUB_SHA" --title "Should I? v1.1.0" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }

          [xml]$project = Get-Content ".\ShouldISell\ShouldISell.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read project version." }

          $download = "https://github.com/$repo/releases/download/$tag/latest.zip"
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          if ($manifest.Count -ne 1) { throw "Expected exactly one plugin entry in pluginmaster.json." }

          $manifest[0].Name = "Should I?"
          $manifest[0].Punchline = "Sell smarter. Buy smarter. Learn your trading style."
          $manifest[0].Description = "One FFXIV Market Board suite containing Should I Sell?, Should I Buy?, and Should I Tycoon?: selling guidance, budget-aware opportunity scanning, vendor and stack arbitrage analysis, confirmed purchase cost-basis capture, personal sales history, and trader performance analytics."
          $manifest[0].AssemblyVersion = $version
          $manifest[0].DownloadLinkInstall = $download
          $manifest[0].DownloadLinkUpdate = $download
          $manifest[0].Changelog = (Get-Content $notesPath -Raw).Trim()
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()

          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: publish Should I v1.1.0"
            git push origin HEAD:main
          }
