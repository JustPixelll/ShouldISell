name: Build Should I Sell

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Find packaged plugin
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Package: $($package.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShouldISell
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  finalize_vendor_safety:
    if: github.event_name == 'push' && github.event.head_commit.message == 'RUN-V1.1.6-VENDOR-SAFETY-BUILD'
    runs-on: windows-2022

    steps:
      - name: Checkout v1.1.6 branch
        uses: actions/checkout@v5
        with:
          ref: fix/v1.1.6-vendor-contestable-buyouts
          fetch-depth: 0

      - name: Apply vendor-contestable safety patch
        shell: pwsh
        run: .\scripts\apply-v1.1.6-vendor-safety.ps1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore v1.1.6
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build v1.1.6 Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Commit validated v1.1.6 patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/Services/BuyOpportunityScanner.cs ShouldISell/Windows/SuiteWindow.Buy.cs ShouldISell/ShouldISell.csproj
          git rm -f .github/workflows/apply-v1.1.6-vendor-safety.yml scripts/apply-v1.1.6-vendor-safety.ps1 .run-v1.1.6-vendor-safety
          git commit -m "fix: block renewable-vendor Market Board buyouts"
          git push origin HEAD:fix/v1.1.6-vendor-contestable-buyouts
