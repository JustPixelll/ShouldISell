name: Apply v1.1.3 Buy deep scan and filters once

on:
  push:
    branches: [ feature/v1.1.3-buy-deep-filters ]

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.event.head_commit.message == 'APPLY-V1.1.3-BUY-DEEP-FILTERS'
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/v1.1.3-buy-deep-filters
          fetch-depth: 0

      - name: Apply targeted source patches
        shell: pwsh
        run: .\scripts\apply-v1.1.3-buy-deep-filters.ps1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build patched plugin
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/Windows/SuiteWindow.Buy.cs ShouldISell/Services/ExperimentalRefreshEngine.cs ShouldISell/Services/BuyOpportunityScanner.cs ShouldISell/ShouldISell.csproj
          if (git diff --cached --quiet) { throw "Patch produced no source changes." }
          git commit -m "feat: native Buy deep scan and result filters"
          git push origin HEAD:feature/v1.1.3-buy-deep-filters
