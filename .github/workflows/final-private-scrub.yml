          # Remove the earlier failed helper and this helper before verification.
          for helper in [Path('.github/workflows/cleanup-private-integration.yml'), Path('.github/workflows/final-private-scrub.yml')]:
              if helper.exists(): helper.unlink()

          pattern = re.compile(r'deep\s*mine|deepmine|shouldideepmine', re.I)
          hits = []
          for f in Path('.').rglob('*'):
              if not f.is_file() or '.git' in f.parts: continue
              try: text = f.read_text()
              except Exception: continue
              if pattern.search(text) or pattern.search(str(f)):
                  hits.append(str(f))
          if hits:
              print('Private references remain:')
              print('\n'.join(hits))
              raise SystemExit(1)
          PY
