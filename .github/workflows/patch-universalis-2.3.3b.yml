name: Patch Universalis 2.3.3b

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/universalis-request-semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/universalis-request-semantics
          fetch-depth: 0
      - name: Apply exact large-file fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once_or_verify(path, old, new, marker):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  if s.count(old) != 1:
                      raise SystemExit(f'{path}: expected one old block, found {s.count(old)}')
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  return
              if marker not in s:
                  raise SystemExit(f'{path}: neither old nor expected new block found')

          scanner = Path('ShouldISell/Services/BuyOpportunityScanner.cs')
          s = scanner.read_text(encoding='utf-8')
          s = s.replace('new ProductInfoHeaderValue("ShouldI", "2.1.0")', 'new ProductInfoHeaderValue("ShouldI", "2.3.3")')
          old = '''        var entriesWithin = 90 * 24 * 60 * 60;
        using (var historyResponse = await http.GetAsync(
                   $"api/v2/history/{worldId}/{joined}?entries=1800&entriesWithin={entriesWithin}&statsWithin={entriesWithin}", token))'''
          new = '''        var entriesWithinSeconds = 90 * 24 * 60 * 60;
        var statsWithinMilliseconds = entriesWithinSeconds * 1000L;
        using (var historyResponse = await http.GetAsync(
                   $"api/v2/history/{worldId}/{joined}?entriesToReturn=1800&entriesWithin={entriesWithinSeconds}&statsWithin={statsWithinMilliseconds}", token))'''
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit(f'BuyOpportunityScanner: expected one history block, found {s.count(old)}')
              s = s.replace(old, new)
          elif 'statsWithinMilliseconds' not in s or 'entriesToReturn=1800' not in s:
              raise SystemExit('BuyOpportunityScanner: expected history request block not found')
          scanner.write_text(s, encoding='utf-8')

          replace_once_or_verify(
              'ShouldISell/Services/LocalStore.cs',
              '''            snapshot.Listings = listings;
            // No upload timestamp means Universalis has no trustworthy observation time. Keep
            // this null so the experimental queue can deliberately refresh the obscure item.
            snapshot.ListingObservedAtUtc = uploadTime;
            snapshot.UniversalisLastUploadUtc = uploadTime;''',
              '''            snapshot.Listings = listings;
            // Cache freshness is when Should I? successfully fetched this snapshot, not when
            // Universalis last received an upstream upload. Preserve the upstream timestamp
            // separately so scoring/UI can still reason about genuinely stale market evidence.
            snapshot.ListingObservedAtUtc = DateTimeOffset.UtcNow;
            snapshot.UniversalisLastUploadUtc = uploadTime;''',
              'Cache freshness is when Should I? successfully fetched this snapshot')
          PY
      - name: Commit and push if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already patched."
            exit 0
          fi
          git config user.name JustPixelll
          git config user.email pixelgod56@gmail.com
          git add ShouldISell/Services/BuyOpportunityScanner.cs ShouldISell/Services/LocalStore.cs
          git diff --cached --check
          git commit -m "Fix remaining Universalis request and cache semantics"
          git push origin HEAD:fix/universalis-request-semantics
