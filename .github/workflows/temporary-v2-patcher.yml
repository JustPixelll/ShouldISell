name: Temporary v2 suite patch runner

on:
  push:
    branches: [ main ]
    paths:
      - .github/v2-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 release branch
        uses: actions/checkout@v5
        with:
          ref: release/v2.0.0-suite
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply v2 patch
        run: python .github/v2_patch.py

      - name: Commit v2 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.0.0 suite identity and scanner fixes"
          git push origin HEAD:release/v2.0.0-suite
