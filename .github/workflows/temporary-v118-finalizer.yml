name: Temporary v1.1.8 release finalizer

on:
  push:
    branches: [ main ]
    paths:
      - .github/v118-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Checkout v1.1.8 source
        uses: actions/checkout@v5
        with:
          ref: v1.1.8
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Locate and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          gh release upload v1.1.8 "$($package.FullName)#latest.zip" --clobber

      - name: Update custom repository manifest
        shell: pwsh
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          if ($manifest.Count -ne 1) { throw "Expected exactly one plugin entry in pluginmaster.json." }

          $manifest[0].AssemblyVersion = "1.1.8.0"
          $manifest[0].DownloadLinkInstall = "https://github.com/JustPixelll/ShouldISell/releases/download/v1.1.8/latest.zip"
          $manifest[0].DownloadLinkUpdate = "https://github.com/JustPixelll/ShouldISell/releases/download/v1.1.8/latest.zip"
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $manifest[0].Changelog = "v1.1.8 adds exact current-listing state age (price + quantity), expands Should I Tycoon? with an observed gil cashflow ledger and editable income/spend categories, and lets normal Market Board purchases be marked Personal so crafting/glamour buys remain in spending history without polluting FIFO trading positions or P&L."

          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if (git diff --cached --quiet) {
            Write-Host "pluginmaster.json already current."
          } else {
            git commit -m "chore: update plugin repository for v1.1.8"
            git push origin main
          }
