name: Temporary v1.1.7 branch patch runner

on:
  push:
    branches: [ main ]
    paths:
      - .github/v117-main-trigger

permissions:
  contents: write

jobs:
  patch-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/v1.1.7-high-ticket-discovery
          fetch-depth: 0

      - name: Apply staged patch
        run: python3 tools/patch_v117_high_ticket.py

      - name: Remove temporary feature files
        run: |
          rm -f tools/patch_v117_high_ticket.py
          rm -f .github/workflows/patch-v1.1.7-high-ticket.yml
          rm -f .github/v1.1.7-high-ticket-trigger

      - name: Commit feature patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix high-ticket Buy discovery bias"
          git push origin HEAD:fix/v1.1.7-high-ticket-discovery
