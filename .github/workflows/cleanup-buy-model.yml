name: Cleanup final portfolio reference

on:
  push:
    branches: [ feature/tooltip-launch-prep ]
    paths: [ .github/workflows/cleanup-buy-model.yml ]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tooltip-launch-prep
          fetch-depth: 0
      - name: Remove stale reference
        shell: pwsh
        run: |
          $path = ".\ShouldISell\Windows\SuiteWindow.BuyModel.cs"
          $text = Get-Content $path -Raw
          $text = $text -replace "(?m)^\s*buyPortfolioPlan = null;\r?\n", ""
          Set-Content $path $text -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          if (-not (git diff --cached --quiet)) {
            git commit -m "Remove stale buy portfolio model reference"
            git push origin HEAD:feature/tooltip-launch-prep
          }
