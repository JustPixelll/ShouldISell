name: Apply v1.1.6 vendor safety once

on:
  push:
    branches: [ fix/v1.1.6-vendor-contestable-buyouts ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'RUN-V1.1.6-VENDOR-SAFETY'
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/v1.1.6-vendor-contestable-buyouts
          fetch-depth: 0

      - name: Apply patch
        shell: pwsh
        run: .\scripts\apply-v1.1.6-vendor-safety.ps1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/Services/BuyOpportunityScanner.cs ShouldISell/Windows/SuiteWindow.Buy.cs ShouldISell/ShouldISell.csproj
          git rm .github/workflows/apply-v1.1.6-vendor-safety.yml scripts/apply-v1.1.6-vendor-safety.ps1 .run-v1.1.6-vendor-safety
          git commit -m "fix: block renewable-vendor Market Board buyouts"
          git push origin HEAD:fix/v1.1.6-vendor-contestable-buyouts
