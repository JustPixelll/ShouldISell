name: Publish Should I v1.1.5 once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'PUBLISH-V1.1.5'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore
        run: dotnet restore .\ShouldISell\ShouldISell.csproj

      - name: Build Release
        run: dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore

      - name: Find packaged plugin
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\ShouldISell\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create v1.1.5 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: Should I? v1.1.5
          target_commitish: main
          files: ${{ steps.package.outputs.path }}
          body: |
            Should I? v1.1.5 improves practical Buy execution and expands Tycoon learning from your own market activity.

            - One-active-listing capital model and sequential listing-cycle pressure for Buy recommendations.
            - Native Deep Scan now re-rates opportunities from fresh FFXIV board data and demotes changed acquisition packages.
            - Vendor → Market tops up one working listing instead of recommending unnecessary stockpiles.
            - Shared 99-unit FFXIV Market Board listing limit across Sell and Buy execution guidance.
            - Tycoon Sales Insights and Listing Insights, including personal listing lifecycle tracking.
            - Unknown acquisition cost remains unknown rather than inventing profit for gathered/crafted/untracked stock.
