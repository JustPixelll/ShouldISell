name: Generate D17 package lock

on:
  push:
    branches: [ feature/tooltip-launch-prep ]
    paths: [ .github/workflows/generate-lock.yml ]

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tooltip-launch-prep
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination
      - name: Restore and build with lock
        shell: pwsh
        run: |
          dotnet restore .\ShouldISell\ShouldISell.csproj --use-lock-file
          dotnet build .\ShouldISell\ShouldISell.csproj --configuration Release --no-restore
      - name: Commit generated lock
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShouldISell/packages.lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: commit D17 dependency lock"
            git push origin HEAD:feature/tooltip-launch-prep
          }
